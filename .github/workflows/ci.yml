name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic-test
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SYNC_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/agentic_test
      SYNC_TEST_DATABASE_USER: agentic
      SYNC_TEST_DATABASE_PASSWORD: agentic-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install Linux Secret Service runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsecret-tools gnome-keyring dbus-x11

      - name: Build and test
        run: |
          dbus-run-session -- bash -ceu '
            # The D8 desktop acceptance tests use the real production secure-store
            # backend. Give the complete Linux suite one isolated unlocked
            # Secret Service session before Gradle starts.
            export XDG_DATA_HOME="$PWD/.ci-keyring-data"
            export XDG_CACHE_HOME="$PWD/.ci-keyring-cache"
            export XDG_RUNTIME_DIR="$PWD/.ci-keyring-runtime"
            mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            eval "$(printf "\n" | gnome-keyring-daemon --login)"
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            export AGENTIC_SCHEDULER_SECRET_SERVICE_INTEGRATION=1
            ./gradlew build --no-daemon
          '

      - name: Upload provisioning acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-credential-jvm-reports
          path: |
            shared/sync/build/test-results/desktopTest/TEST-*ProviderCredential*.xml
            shared/application/build/test-results/desktopTest/TEST-*ProviderCredential*.xml
            shared/application/build/test-results/desktopTest/TEST-*DesktopPlatformSecureStoreTest.xml
            shared/database/build/test-results/desktopTest/TEST-*ProviderCredential*.xml
            server/sync/build/test-results/test/TEST-*ProviderCredential*.xml
            apps/wear/build/test-results/testDebugUnitTest/TEST-*Wear*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-failure-reports
          path: shared/application/build/test-results/desktopTest/TEST-dev.agenticscheduler.application.sync.D9AgentHistoryPostgresE2ETest.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build dogfood app artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :apps:android:assembleDebug :apps:desktop:createDistributable --no-daemon

      - name: Upload Android dogfood APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-scheduler-android-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Desktop dogfood app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-scheduler-desktop-linux
          path: apps/desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14

  agent-history-platform-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic-test
          POSTGRES_DB: agentic_d90205_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_d90205_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SYNC_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/agentic_d90205_platform
      SYNC_TEST_DATABASE_USER: agentic
      SYNC_TEST_DATABASE_PASSWORD: agentic-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install acceptance runtimes
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          sudo apt-get update
          sudo apt-get install --yes libsecret-tools gnome-keyring dbus-x11 postgresql-client
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Enrolled Desktop Android round trip with relay restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            dbus-run-session -- bash -ceu 'export XDG_DATA_HOME="$PWD/build/d9-platform-keyring-data"; export XDG_CACHE_HOME="$PWD/build/d9-platform-keyring-cache"; export XDG_RUNTIME_DIR="$PWD/build/d9-platform-keyring-runtime"; mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"; eval "$(printf "\n" | gnome-keyring-daemon --login)"; eval "$(gnome-keyring-daemon --start --components=secrets)"; export AGENTIC_SCHEDULER_SECRET_SERVICE_INTEGRATION=1; bash test-support/d9-02-05/run-platform-acceptance.sh'
      - name: Upload only test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d9-agent-history-platform-reports
          path: |
            build/d90205-platform/*.xml
            build/d90205-platform/android-*.txt
            apps/android/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Verify immutable D10-03 evidence against its accepted source.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build Windows Desktop dogfood app
        run: .\gradlew.bat :apps:desktop:createDistributable --no-daemon
      - name: Verify Windows DPAPI secure store
        run: .\gradlew.bat :shared:application:desktopTest --tests "*DesktopPlatformSecureStoreTest" --no-daemon
      - name: Verify Windows presentation and capture synthetic Compose fixtures
        run: .\gradlew.bat :shared:ui:desktopTest :apps:desktop:test --no-daemon
      - name: Check presentation ownership and Markdown status
        run: |
            python test-support/d10-02/check-boundaries.py --source-only
            python test-support/d10-02/check-candidates.py
            python test-support/d10-03/check-boundaries.py --source-only
            python test-support/d10-03/check-candidates.py --source-revision cdc8504527cc636f5d2932b7e00785f4be9ecaad
            python test-support/d10-04/check-boundaries.py
            python test-support/d10-04/check-candidates.py
      - name: Upload Windows presentation candidates and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d10-windows-presentation
          path: |
            apps/desktop/build/d10-01/screenshots/*.png
            apps/desktop/build/d10-02/screenshots/*.png
            apps/desktop/build/d10-03/screenshots/*.png
            apps/desktop/build/d10-04/screenshots/*.png
            apps/desktop/build/test-results/test/*.xml
            shared/ui/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows Desktop dogfood app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-scheduler-desktop-windows
          path: apps/desktop/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14

  android-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM for Android instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify Android Keystore secure store
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            # The relay fixture test executes in agent-history-platform-e2e with its real enrolled peer.
            # Without that fixture UTP reports its AssumptionViolatedException as failure, not skipped.
            ./gradlew :apps:android:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.agenticscheduler.android.D9PlatformRelayInstrumentedTest --no-daemon
            bash test-support/d10-02/capture-android.sh
            bash test-support/d10-03/capture-android.sh
            bash test-support/d10-04/capture-android.sh
            # Core Watch runtime/UI acceptance is required on the Wear job, never phone/fake platform.
            ./gradlew :apps:wear:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.agenticscheduler.wear.WearKeystoreSecureStoreInstrumentedTest --no-daemon
            mkdir -p apps/wear/build/phone-platform-reports/keystore
            cp -R apps/wear/build/outputs/androidTest-results/connected/. apps/wear/build/phone-platform-reports/keystore/
            ./gradlew :apps:wear:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.agenticscheduler.wear.ProviderCredentialSlotInstrumentedTest --no-daemon
            mkdir -p apps/wear/build/phone-platform-reports/provider-slot
            cp -R apps/wear/build/outputs/androidTest-results/connected/. apps/wear/build/phone-platform-reports/provider-slot/
            ./gradlew :apps:wear:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.agenticscheduler.wear.WearCapabilityInstrumentedTest --no-daemon
            mkdir -p apps/wear/build/phone-platform-reports/capability
            cp -R apps/wear/build/outputs/androidTest-results/connected/. apps/wear/build/phone-platform-reports/capability/
            adb logcat -d -s D90302Evidence:I > apps/wear/build/d90302-platform-evidence.txt
      - name: Upload Android provisioning reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-credential-android-reports
          path: |
            apps/android/build/outputs/androidTest-results/connected/**/TEST-*.xml
            build/d10-02/android-captures/**
            build/d10-03/android-captures/**
            build/d10-04/android-captures/**
            apps/wear/build/outputs/androidTest-results/connected/**/TEST-*.xml
            apps/wear/build/phone-platform-reports/**/TEST-*.xml
            apps/wear/build/d90302-platform-evidence.txt
          if-no-files-found: warn
          retention-days: 14

  wear-keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM for Wear instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify Wear Android Keystore secure store
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: 35-ext15
          target: android-wear
          arch: x86_64
          script: |
            ./gradlew :apps:wear:connectedDebugAndroidTest --no-daemon
            adb logcat -d -s D90302Evidence:I > apps/wear/build/d90302-platform-evidence.txt
      - name: Upload Wear provisioning reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-credential-wear-reports
          path: |
            apps/wear/build/outputs/androidTest-results/connected/**/TEST-*.xml
            apps/wear/build/d90302-platform-evidence.txt
          if-no-files-found: warn
          retention-days: 14
